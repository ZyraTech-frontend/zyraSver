# ══════════════════════════════════════════════════════════════
# ZyraTech Hub — Docker Compose
# One command to spin up the API + PostgreSQL database
# Usage: docker-compose up -d
# ══════════════════════════════════════════════════════════════

version: "3.8"

services:


  # ── ZyraTech API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zyratech-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env
    # Run migrations, seed, then start the server
    command: >
      sh -c "
        echo '🔄 Running database migrations...' &&
        npx prisma migrate deploy &&
        echo '🌱 Running database seeder...' &&
        node prisma/seed.js &&
        echo '🚀 Starting ZyraTech API...' &&
        node dist/index.js
      "


