name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Continuous Integration (Test & Build)
  # ══════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type Check & Build
      run: npm run build

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Continuous Deployment (SSH to Server)
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build # Only run if the build job passes
    if: github.ref == 'refs/heads/main' # Only deploy when pushing to main

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Starting Deployment Process..."
          
          # Navigate to project directory (update this path based on your server setup)
          cd /var/www/zyratech-backend || cd ~/zyratech-backend
          
          # Pull latest code from GitHub
          echo "📥 Pulling latest code..."
          git pull origin main
          
          # Rebuild and restart Docker containers in detached mode
          echo "🔄 Rebuilding Docker containers..."
          sudo docker-compose down
          sudo docker-compose up -d --build
          
          echo "✅ Deployment Successful!"
